# -- Theme Options --
# Optimizado para diseño minimalista y limpio
# https://blowfish.page/docs/configuration/#theme-parameters

colorScheme = "noir"
defaultAppearance = "light"
autoSwitchAppearance = true

enableA11y = true  # ACTIVADO: accesibilidad es importante para justicia
enableSearch = true
enableCodeCopy = false
enableStructuredBreadcrumbs = false
enableStyledScrollbar = true

replyByEmail = false

disableImageOptimization = false
disableImageOptimizationMD = false
disableTextInHeader = false

defaultSocialImage = "/android-chrome-512x512.png"
hotlinkFeatureImage = false

fingerprintAlgorithm = "sha512"

giteaDefaultServer = "https://git.fsfe.org"
forgejoDefaultServer = "https://v11.next.forgejo.org"

[seo]
# Mantener limpio - no necesita metaDescriptionOrder personalizado

[header]
  layout = "fixed"  # Mantiene la navegación accesible

[footer]
  showMenu = true
  showCopyright = true
  showThemeAttribution = true
  showAppearanceSwitcher = true
  showScrollToTop = false  # Minimalismo: menos elementos

# ===== HOMEPAGE - Lo más importante =====
[homepage]
  layout = "page"  # CLAVE: 'page' es lo más limpio y controlable
  showRecent = false  # No quieres contenido autogenerado
  cardView = false  # DESACTIVADO: queremos estructura simple, no cards
  cardViewScreenWidth = false
  layoutBackgroundBlur = false
  disableHeroImageFilter = true

# ===== ARTICLE (para páginas de contenido) =====
[article]
  showDate = false  # Minimalismo: sin ruido de fechas
  showViews = false
  showLikes = false
  showDateOnlyInArticle = false
  showDateUpdated = false
  showAuthor = false  # Mantener limpio
  showHero = false  # Sin imágenes gigantes
  layoutBackgroundBlur = false
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showDraftLabel = false  # En production
  showEdit = false
  editAppendPath = true
  seriesOpened = false
  showHeadingAnchors = false  # Minimalismo: sin visual anchors
  showPagination = true
  invertPagination = false
  showReadingTime = false  # Sin ruido
  showTableOfContents = false
  showTaxonomies = false
  showCategories = false
  showTags = false
  showAuthorsBadges = false
  showWordCount = false
  showZenMode = false

# ===== LIST (para páginas de publicaciones, recursos, etc) =====
[list]
  showHero = false
  layoutBackgroundBlur = false
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showSummary = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  showCards = false
  orderByWeight = false
  groupByYear = false  # Simple list, sin agrupar
  cardView = false  # Estructura limpia
  cardViewScreenWidth = false
  constrainItemsWidth = false

[sitemap]
  excludedKinds = ["taxonomy", "term"]

[taxonomy]
  showTermCount = false
  showHero = false
  layoutBackgroundBlur = false
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  cardView = false

[term]
  showHero = false
  layoutBackgroundBlur = false
  layoutBackgroundHeaderSpace = false
  showBreadcrumbs = false
  showViews = false
  showLikes = false
  showTableOfContents = false
  groupByYear = false
  cardView = false
  cardViewScreenWidth = false

# Mantener analytics/verification comentado para producción